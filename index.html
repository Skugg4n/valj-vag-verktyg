<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Välj Väg Verktyg</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Source+Serif+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Old browsers (no module support) cannot run the app. On shared story
      // links they get the simple reader instead; ?enkel forces it anywhere.
      (function () {
        var m = window.location.pathname.match(/^\/(las|spela)\/([^\/]+)\/?$/);
        var canRunFull = 'noModule' in document.createElement('script');
        var asked = /[?&]enkel\b/.test(window.location.search);
        if (!m || (canRunFull && !asked)) return;
        // Old browsers go to the stand-alone page, which also works offline.
        if (!canRunFull) { window.location.replace('/enkel.html?' + m[1] + '=' + m[2]); return; }
        window.__VV_LITE__ = { kind: m[1], shareId: m[2], canRunFull: canRunFull };
        var s = document.createElement('script');
        s.src = '/lite.js';
        document.body.appendChild(s);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
